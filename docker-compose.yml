services:
  flight-watcher:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flight-watcher
    restart: unless-stopped
    environment:
      ADSBLOL_BASE_URL: ${ADSBLOL_BASE_URL:-https://api.adsb.lol}
      POLL_SECONDS: ${POLL_SECONDS:-10}
      SEARCH_RADIUS_NM: ${SEARCH_RADIUS_NM:-50}

      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
      SEND_STARTUP_TEST: ${SEND_STARTUP_TEST:-true}

      # Home: ALL aircraft
      HOME_LAT: ${HOME_LAT}
      HOME_LON: ${HOME_LON}
      HOME_MAX_ALTITUDE_FT: ${HOME_MAX_ALTITUDE_FT:-15000}
      HOME_EARLY_RADIUS_NM: ${HOME_EARLY_RADIUS_NM:-2.0}
      HOME_EARLY_ETA_MIN: ${HOME_EARLY_ETA_MIN:-8}
      HOME_IMMEDIATE_RADIUS_NM: ${HOME_IMMEDIATE_RADIUS_NM:-1.0}
      HOME_IMMEDIATE_ETA_MIN: ${HOME_IMMEDIATE_ETA_MIN:-3}
      HOME_MAX_BEARING_ERROR_DEG: ${HOME_MAX_BEARING_ERROR_DEG:-25}
      HOME_MIN_CONVERGING_SAMPLES: ${HOME_MIN_CONVERGING_SAMPLES:-3}

      # LaVell Edwards Stadium: MILITARY only
      STADIUM_LAT: ${STADIUM_LAT:-40.25753}
      STADIUM_LON: ${STADIUM_LON:--111.65456}
      STADIUM_MAX_ALTITUDE_FT: ${STADIUM_MAX_ALTITUDE_FT:-15000}
      STADIUM_EARLY_RADIUS_NM: ${STADIUM_EARLY_RADIUS_NM:-5.0}
      STADIUM_EARLY_ETA_MIN: ${STADIUM_EARLY_ETA_MIN:-10}
      STADIUM_IMMEDIATE_RADIUS_NM: ${STADIUM_IMMEDIATE_RADIUS_NM:-2.0}
      STADIUM_IMMEDIATE_ETA_MIN: ${STADIUM_IMMEDIATE_ETA_MIN:-5}
      STADIUM_MAX_BEARING_ERROR_DEG: ${STADIUM_MAX_BEARING_ERROR_DEG:-30}
      STADIUM_MIN_CONVERGING_SAMPLES: ${STADIUM_MIN_CONVERGING_SAMPLES:-3}

      # N130TP
      WATCHED_TAIL: ${WATCHED_TAIL:-N130TP}
      PVU_LAT: ${PVU_LAT:-40.2192}
      PVU_LON: ${PVU_LON:--111.7234}
      PVU_ELEV_FT: ${PVU_ELEV_FT:-4497}
      PVU_START_RADIUS_NM: ${PVU_START_RADIUS_NM:-2.0}
      PVU_LOW_ALT_AGL_FT: ${PVU_LOW_ALT_AGL_FT:-800}

      EARLY_COOLDOWN_MINUTES: ${EARLY_COOLDOWN_MINUTES:-45}
      IMMEDIATE_COOLDOWN_MINUTES: ${IMMEDIATE_COOLDOWN_MINUTES:-30}
      PVU_COOLDOWN_MINUTES: ${PVU_COOLDOWN_MINUTES:-30}

    volumes:
      - flight-watcher-data:/data

volumes:
  flight-watcher-data:
